<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  LibiaoLink 预览转换器 · 中文字体映射（ADR-007 构建门禁：PDF 中文不乱码）
  =================================================================
  镜像内只装 Noto CJK（开源、可分发；不为商业字体承担授权风险），
  用本文件把 Office 文档里常见的商业字体名「就近映射」到 Noto：
    宋体 / SimSun / NSimSun / 新宋体        -> Noto Serif CJK SC（衬线）
    黑体 / SimHei / 微软雅黑 / Microsoft YaHei -> Noto Sans CJK SC（无衬线）
    等线 / DengXian / 仿宋 / FangSong / 楷体 / KaiTi -> Noto Serif CJK SC 兜底
  DConf 构建期门禁（Dockerfile 内 fc-match 断言）会校验映射是否生效。
-->
<fontconfig>

  <!-- 宋体系：衬线 -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>新宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- 黑体系：无衬线 -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>DengXian</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>等线</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- 通用族兜底：中文语境下 sans-serif / serif 优先落到 Noto CJK SC -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family" compare="eq" ignore-blanks="true"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family" compare="eq" ignore-blanks="true"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

</fontconfig>

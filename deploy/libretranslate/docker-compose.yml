# ============================================================
# LibiaoLink LibreTranslate 内网翻译服务（dev 沙箱形态）
# ------------------------------------------------------------
# 用途：导出报告「项目进展描述」列 zh→en 机器翻译；纯内网推理、数据零外发、无 API Key。
#
# 用法（本目录下）：
#   node scripts/seed-models.mjs --with-packages   # 预置分句模型 + 语言包（第一次必须跑，见 README「踩坑」）
#   docker compose up -d
#   docker compose logs -f translate
#
# 形态说明：
#   - 数据目录 ./data/argos 挂进容器 /home/libretranslate/.local/share/argos-translate：
#     minisbd/（分句模型）+ packages/（语言包）都随目录持久化，容器重建不重下；
#   - 端口默认只发回环 127.0.0.1（局域网联调在 .env 覆盖 LT_BIND_IP）；
#   - 办公网对 GitHub Releases 的 TLS 时通时断 —— 分句模型一律由 seed-models.mjs 预置，
#     容器首启不再外网取（minisbd 缓存命中即跳过下载）。
# ============================================================
name: libiaolink-libretranslate

services:
  translate:
    image: "${LT_IMAGE:-libretranslate/libretranslate:latest}"
    container_name: libiaolink-libretranslate
    restart: unless-stopped
    init: true
    environment:
      LT_LOAD_ONLY: "${LT_LOAD_ONLY:-zh,en}"
      LT_THREADS: "${LT_THREADS:-2}"
      LT_UPDATE_MODELS: "false"
      # 交付形态可关掉自带网页界面（只留 API；本地保留方便人工试译）
      # LT_DISABLE_WEB_UI: "true"
    ports:
      - "${LT_BIND_IP:-127.0.0.1}:${LT_PORT:-5005}:5000"
    volumes:
      - ./data/argos:/home/libretranslate/.local/share/argos-translate
    mem_limit: ${LT_MEM_LIMIT:-2g}
    cpus: ${LT_CPUS:-2}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:5000/languages", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
